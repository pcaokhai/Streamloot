<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Streamloot Probe</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: 13px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 12px; min-width: 380px; }
      h1 { font-size: 13px; margin: 0 0 2px; }
      .sub { opacity: .6; font-size: 11px; margin-bottom: 10px; }
      .score { font-size: 22px; font-weight: 600; margin: 8px 0; }
      table { border-collapse: collapse; width: 100%; font-size: 12px; }
      th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent); }
      th { font-weight: 600; opacity: .6; font-size: 11px; }
      td.host { font-family: ui-monospace, monospace; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .empty { opacity: .6; padding: 16px 0; }
      button { margin-top: 10px; font: inherit; padding: 4px 10px; }
    </style>
  </head>
  <body>
    <h1>Streamloot Probe</h1>
    <div class="sub">ADR 0005 · Giai đoạn 0 — chỉ quan sát, không tải gì</div>
    <div class="score" id="score">—</div>
    <div id="out"></div>
    <button id="clear">Xoá kết quả</button>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
